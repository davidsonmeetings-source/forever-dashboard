  const auto=pwArg!=null;
  const pw=auto?pwArg:document.getElementById('pw').value, err=document.getElementById('err');
  if(!auto)err.textContent='מפענח…';
  try{
    const enc=new TextEncoder();
    const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:dec(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(IV)},key,dec(CT));
    const html=new TextDecoder().decode(pt);
    // cache so refresh doesn't re-prompt; localStorage too, so links that open a NEW TAB
    // (e.g. the dashboards' KB button) unlock without asking again (sessionStorage is per-tab)
    try{sessionStorage.setItem('dpw',pw);}catch(e){}
    try{localStorage.setItem('dpw',pw);}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){ if(!auto) err.textContent='סיסמה שגויה'; /* auto-fail: fall through to the prompt; don't clear the cache — a wrong cached pw for THIS page may still be right for the page the user came from */ }
}
document.getElementById('go').onclick=()=>unlock();
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
// auto-unlock from cached password (seamless refresh + cross-tab via localStorage)
try{var _s=sessionStorage.getItem('dpw')||localStorage.getItem('dpw');if(_s)unlock(_s);}catch(e){}
</script></body></html>
